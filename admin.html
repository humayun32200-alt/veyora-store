
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEYORA | Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      background: #10100e; color: #f5e8c8;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%; max-width: 390px; padding: 30px;
      border: 1px solid #a88746; border-radius: 16px;
      background: #191916;
    }
    h1 { margin: 0 0 8px; letter-spacing: 3px; }
    p { color: #c3bba8; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%; padding: 12px; border-radius: 8px;
      border: 1px solid #625333; background: #10100e;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; margin-top: 22px; padding: 13px;
      background: #c9a45c; border: 0; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>VEYORA</h1>
    <p> MAYU WORLD · Secure Admin Panel</p>
    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username"
        placeholder="Your admin email" required>
      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <p id="message">Login will work after Supabase authentication is connected.</p>
    </form>
  </main>
</body>
</html>
