
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEYORA | Secure Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#29251a,#10100e 65%);color:#f5e8c8;font-family:Arial,sans-serif}
.panel{width:100%;max-width:400px;padding:30px;border:1px solid #a88746;border-radius:16px;background:#191916;box-shadow:0 20px 60px #0008}
h1{margin:0;letter-spacing:4px;color:#d6b66e}
p{color:#c3bba8;line-height:1.5}
label{display:block;margin:18px 0 7px}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #625333;background:#10100e;color:white;font-size:16px}
button{width:100%;margin-top:22px;padding:13px;background:#c9a45c;border:0;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#message{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<main class="panel">
<h1>VEYORA</h1>
<p>MAYU WORLD · Secure Admin Panel</p>
<form id="loginForm">
<label for="email">Admin Email</label>
<input id="email" type="email" autocomplete="username" placeholder="Your admin email" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
<button id="loginBtn" type="submit">Sign In</button>
<p id="message" role="status">Sign in with your authorized admin account.</p>
</form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fudkfvwwbqmflmtkbtkk.supabase.co";
const SUPABASE_KEY = "sb_publishable_gAVAuyV6GiEq_qhFKjOwlw_VLhc9R_b";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  button.disabled = true;
  message.textContent = "Checking your login...";

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    if (data.user?.app_metadata?.role !== "admin") {
      await db.auth.signOut();
      throw new Error("This account is not authorized as an admin.");
    }

    message.textContent = "Admin login successful. Next, we will connect your dashboard.";
  } catch (error) {
    message.textContent = error.message || "Login failed. Please try again.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
